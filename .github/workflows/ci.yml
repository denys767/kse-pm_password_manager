name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Builds the React frontend (frontend-maven-plugin) and runs all tests,
      # including the Testcontainers Flyway migration test (Docker is
      # available on GitHub-hosted runners; the test is CI-gated).
      - name: Build and test
        run: mvn -B verify
        env:
          CI: 'true'
