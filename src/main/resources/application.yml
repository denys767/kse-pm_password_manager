spring:
  application:
    name: kse-pm-password-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pm}
    username: ${DB_USER:pm}
    password: ${DB_PASSWORD:pm}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/kse-pm}

server:
  port: 8080
  tomcat:
    # Attachments stream through as raw request/response bodies with no
    # application-level size cap (see AttachmentService, GoogleDriveAttachmentStore);
    # the default swallow limit would otherwise abort a large upload after Tomcat
    # decided to discard it.
    max-swallow-size: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

pm:
  extension:
    oauth-client-id: ${EXTENSION_OAUTH_CLIENT_ID:kse-pm-extension}
  google-workspace:
    customer-id: ${GOOGLE_WORKSPACE_CUSTOMER_ID:my_customer}
    domain: ${GOOGLE_WORKSPACE_DOMAIN:kse.org.ua}
    # Impersonated via IAM Credentials API signJwt — no downloaded key.
    # Caller identity comes from Application Default Credentials, which
    # must hold roles/iam.serviceAccountTokenCreator on this service account.
    service-account-email: ${GOOGLE_WORKSPACE_SERVICE_ACCOUNT_EMAIL:}
    admin-email: ${GOOGLE_WORKSPACE_ADMIN_EMAIL:}
    # Path to a service-account JSON key with domain-wide delegation. Prefer
    # workload identity federation (below) or an attached service account
    # (GCE/GKE metadata) — both are keyless and most Workspace admins will not
    # authorize a downloaded key. Set this only when neither is available: the
    # key signs the delegation assertion locally, so nothing in the chain can
    # expire and no human ever has to re-authenticate. A `gcloud auth
    # application-default login` credential is a user credential and Google's
    # reauth policy kills it within hours (invalid_rapt) — never usable here.
    credentials-path: ${GOOGLE_WORKSPACE_CREDENTIALS_PATH:}
    federation:
      # Workload identity federation: the app authenticates to Keycloak as a
      # confidential client (client_credentials — a machine grant, no human,
      # no reauth policy) and exchanges that OIDC token at Google STS for a
      # federated caller identity that signs the delegation assertion. Keyless
      # and works off GCP. Leave token-url empty to fall back to Application
      # Default Credentials instead.
      token-url: ${WORKSPACE_FEDERATION_TOKEN_URL:}
      sts-url: ${WORKSPACE_FEDERATION_STS_URL:https://sts.googleapis.com/v1/}
      client-id: ${WORKSPACE_FEDERATION_CLIENT_ID:}
      client-secret: ${WORKSPACE_FEDERATION_CLIENT_SECRET:}
      # Full resource name of the workload identity pool provider, e.g.
      # //iam.googleapis.com/projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
      audience: ${WORKSPACE_FEDERATION_AUDIENCE:}
    # Proactive token renewal, so a broken credential shows up in the logs and
    # on the admin screen instead of in a user's face.
    token-refresh-ms: ${WORKSPACE_TOKEN_REFRESH_MS:600000}
    # Fails closed by default: while the Workspace snapshot is empty, roles and
    # revocations cannot be enforced, and an empty table is also what a failed
    # or partial sync leaves behind — not just a fresh database. Set this to
    # true to accept that risk and admit in-domain SSO accounts as ordinary
    # USERs until a sync succeeds, so a Google outage cannot lock everyone out.
    provisional-access-when-unsynced: ${WORKSPACE_PROVISIONAL_ACCESS:false}
    # Retry cadence until the first successful sync; the steady-state interval
    # is sync-interval-ms.
    bootstrap-retry-ms: ${WORKSPACE_BOOTSTRAP_RETRY_MS:60000}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:300}
    # /api/external-shares/** and /api/audit/keycloak-events authenticate
    # nobody, so this filter is the only thing standing between a guessable id
    # or a shared secret and an unlimited retry loop.
    unauthenticated-requests-per-minute: ${RATE_LIMIT_UNAUTHENTICATED_PER_MINUTE:20}
    # /api/keys/** is a "which users have vaults" oracle for any authenticated
    # caller; normal sharing needs a few calls, not hundreds.
    key-directory-requests-per-minute: ${RATE_LIMIT_KEY_DIRECTORY_PER_MINUTE:60}
    # Peers whose X-Forwarded-For is believed, as literal addresses or CIDR
    # blocks. Empty means trust nothing and key every client on its real socket
    # address — correct when the app is reached directly. Set this to the
    # reverse proxy (the Docker bridge network in the bundled compose files),
    # otherwise the header spoofs the limit away.
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
  audit:
    keycloak-events-secret: ${KEYCLOAK_EVENTS_SECRET:}

logging:
  structured:
    format:
      # Elastic Common Schema JSON on stdout — consumable by any log
      # aggregator (ELK, Datadog, CloudWatch). actorEmail/requestId from
      # LoggingContextFilter ride along as extra MDC fields on every line,
      # correlating technical logs with the business audit_events log.
      console: ecs
