spring:
  application:
    name: kse-pm-password-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pm}
    username: ${DB_USER:pm}
    password: ${DB_PASSWORD:pm}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/kse-pm}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

pm:
  google-workspace:
    customer-id: ${GOOGLE_WORKSPACE_CUSTOMER_ID:my_customer}
    domain: ${GOOGLE_WORKSPACE_DOMAIN:kse.org.ua}
  rate-limit:
    requests-per-minute: 300
  keycloak:
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
  audit:
    keycloak-events-secret: ${KEYCLOAK_EVENTS_SECRET:}

logging:
  structured:
    format:
      # Elastic Common Schema JSON on stdout — consumable by any log
      # aggregator (ELK, Datadog, CloudWatch). actorEmail/requestId from
      # LoggingContextFilter ride along as extra MDC fields on every line,
      # correlating technical logs with the business audit_events log.
      console: ecs
