events {}

http {
    # App on :443, Keycloak on :8443 — both behind TLS.
    server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        # connect-src: own API + HIBP breach check + Keycloak (token endpoint).
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.pwnedpasswords.com https://$host:8443; frame-ancestors 'none'" always;

        # Actuator stays internal; only the health probe is reachable.
        location /actuator/health {
            proxy_pass http://app:8080;
        }
        location /actuator/ {
            return 403;
        }
        # Swagger UI is a dev/staging tool — block it on the public edge.
        location ~ ^/(swagger-ui|v3/api-docs) {
            return 403;
        }
        # Keycloak posts audit events directly over the internal Docker
        # network to app:8080. Never expose its shared-secret endpoint here.
        location = /api/audit/keycloak-events {
            return 404;
        }

        location / {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 8443 ssl;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://keycloak:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
