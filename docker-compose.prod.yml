# Production-shaped stack: nginx (TLS termination + security headers) in
# front of the app, PostgreSQL and Keycloak on the internal network only.
#
# Before first run:
#   1. Put TLS cert/key into ./nginx/certs/server.crt and server.key
#      (self-signed for staging: openssl req -x509 -newkey rsa:2048 -nodes
#       -keyout nginx/certs/server.key -out nginx/certs/server.crt -days 365
#       -subj "/CN=pm.example.com")
#   2. Set real secrets via environment or a .env file.
services:
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pm
      DB_USER: pm
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://keycloak:8081/realms/kse-pm}
      KEYCLOAK_EVENTS_SECRET: ${KEYCLOAK_EVENTS_SECRET:?set KEYCLOAK_EVENTS_SECRET}
      GOOGLE_WORKSPACE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_WORKSPACE_SERVICE_ACCOUNT_EMAIL:?set GOOGLE_WORKSPACE_SERVICE_ACCOUNT_EMAIL}
      GOOGLE_WORKSPACE_ADMIN_EMAIL: ${GOOGLE_WORKSPACE_ADMIN_EMAIL:?set GOOGLE_WORKSPACE_ADMIN_EMAIL}
      GOOGLE_WORKSPACE_CUSTOMER_ID: ${GOOGLE_WORKSPACE_CUSTOMER_ID:-my_customer}
      GOOGLE_WORKSPACE_DOMAIN: ${GOOGLE_WORKSPACE_DOMAIN:?set GOOGLE_WORKSPACE_DOMAIN}
      # Off GCP, prefer workload identity federation: the app authenticates to
      # this stack's own Keycloak as a confidential client and exchanges that
      # token at Google STS, so nothing here can expire without a human. Set
      # these four and leave GOOGLE_WORKSPACE_CREDENTIALS_PATH empty:
      WORKSPACE_FEDERATION_TOKEN_URL: ${WORKSPACE_FEDERATION_TOKEN_URL:-}
      WORKSPACE_FEDERATION_CLIENT_ID: ${WORKSPACE_FEDERATION_CLIENT_ID:-}
      WORKSPACE_FEDERATION_CLIENT_SECRET: ${WORKSPACE_FEDERATION_CLIENT_SECRET:-}
      WORKSPACE_FEDERATION_AUDIENCE: ${WORKSPACE_FEDERATION_AUDIENCE:-}
      # On GCE/GKE, leave federation and this empty instead: an attached
      # service account holding roles/iam.serviceAccountTokenCreator on the
      # target SA resolves through the metadata server and renews itself.
      # Last resort only (most Workspace admins will not authorize a
      # downloaded key) — mount a domain-wide-delegated service-account key
      # and point this at it, see the volume below. Do NOT run a production
      # deployment on a `gcloud auth application-default login` credential:
      # Google's reauth policy expires it within hours and directory access
      # dies with it.
      GOOGLE_WORKSPACE_CREDENTIALS_PATH: ${GOOGLE_WORKSPACE_CREDENTIALS_PATH:-}
    volumes:
      # Only needed for the service-account-key fallback: mount the key
      # read-only when GOOGLE_WORKSPACE_CREDENTIALS_PATH is set to
      # /run/secrets/workspace-sa.json. Keep the file out of the image and out
      # of git; rotate it by replacing the file (no restart needed).
      - ${GOOGLE_WORKSPACE_KEY_FILE:-/dev/null}:/run/secrets/workspace-sa.json:ro
    depends_on:
      - postgres
      - keycloak
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pm
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.6
    command: start --features=passkeys --import-realm --http-port=8081 --proxy-headers=xforwarded --hostname=${KEYCLOAK_HOSTNAME:?set KEYCLOAK_HOSTNAME}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/pm
      KC_DB_USERNAME: pm
      KC_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
      # Optional: only needed when the backend uses workload identity
      # federation instead of a service-account key or attached identity.
      # The audience is substituted into the kse-pm-federation client's
      # audience mapper, so Google STS accepts the token's aud claim.
      WORKSPACE_FEDERATION_CLIENT_SECRET: ${WORKSPACE_FEDERATION_CLIENT_SECRET:-}
      WORKSPACE_FEDERATION_AUDIENCE: ${WORKSPACE_FEDERATION_AUDIENCE:-}
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak/themes:/opt/keycloak/themes:ro
    restart: unless-stopped

  nginx:
    image: nginx:1.27
    ports:
      - "443:443"
      - "8443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
      - keycloak
    restart: unless-stopped

  # Applies the account-console browser flow override that realm-export.json
  # cannot express (Keycloak creates the account-console client itself, so an
  # export entry for it fails the whole import with "Duplicate resource").
  # Without this, Account Console -> Signing in -> Set up passkey fails with
  # "Cannot login, credential setup required", i.e. adding a passkey is broken
  # on a fresh stack. Runs to completion and exits.
  keycloak-init:
    image: alpine:3.20
    depends_on:
      - keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./keycloak:/keycloak:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache bash curl python3 >/dev/null && bash /keycloak/bind-account-console-flow.sh http://keycloak:8081 kse-pm
    restart: on-failure

volumes:
  pgdata:
